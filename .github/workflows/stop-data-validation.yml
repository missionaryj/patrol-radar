name: Stop data validation
on:
  pull_request:
    branches: [main]
    paths: ['scripts/**', 'src/**', 'docs/urbana*', 'docs/illinois-stop-coverage.md', 'package*.json', '.github/workflows/stop-data-validation.yml']
permissions: { contents: read }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
