apply plugin: 'com.android.application'

android {
    namespace "io.github.missionaryj.patrolradar"
    // Keep the optional native implementation out of normal release builds until validated.
    if (System.getenv('MAPBOX_NAV_SDK_ENABLED') == 'true' &&
        (System.getenv('MAPBOX_DOWNLOADS_TOKEN') ?: rootProject.findProperty('MAPBOX_DOWNLOADS_TOKEN'))) {
        sourceSets.main.java.srcDirs += 'src/mapbox/java'
    }
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.missionaryj.patrolradar"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode((System.getenv("VERSION_CODE") ?: "1") as int)
        // versionName is package.json. versionCode is VERSION_CODE, the workflow run number.
        versionName(System.getenv("VERSION_NAME") ?: new groovy.json.JsonSlurper().parse(file("../../package.json")).version)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Public runtime token; never use the secret Maven downloads token here.
        def publicToken = (System.getenv("VITE_MAPBOX_PUBLIC_TOKEN") ?: "").trim()
        if (publicToken && !publicToken.startsWith("pk.")) {
            throw new GradleException("VITE_MAPBOX_PUBLIC_TOKEN must start with pk.")
        }
        resValue "string", "mapbox_access_token", publicToken
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        debug {
            // Fixed, public debug key so every CI build installs over the previous one. Not a release key.
            storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
        }
        // Play upload key. Never committed: CI writes the keystore from secrets, locally point at /home/box/secrets.
        if (System.getenv('ANDROID_UPLOAD_KEYSTORE')) {
            release {
                storeFile file(System.getenv('ANDROID_UPLOAD_KEYSTORE'))
                storePassword System.getenv('ANDROID_UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            // Shrink and obfuscate. Resource shrinking stays off: Capacitor looks up some
            // mipmap, drawable, and raw files by name (AssetUtil.getIdentifier).
            minifyEnabled true
            // Play reads native symbols from the bundle when a dependency ships .so files
            // (Mapbox Navigation). No effect on builds that contain no native code.
            ndk { debugSymbolLevel 'FULL' }
            if (System.getenv('ANDROID_UPLOAD_KEYSTORE')) { signingConfig signingConfigs.release }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Required for Google Play to recognize subscription-capable app bundles.
    // No purchase flows are exposed until server-verified entitlements are implemented.
    implementation "com.android.billingclient:billing:9.1.0"
    // Explicitly opt in with MAPBOX_NAV_SDK_ENABLED=true and MAPBOX_DOWNLOADS_TOKEN.
    // This is the SDK dependency only; route search and active guidance are NOT implemented.
    if (System.getenv('MAPBOX_NAV_SDK_ENABLED') == 'true' &&
        (System.getenv('MAPBOX_DOWNLOADS_TOKEN') ?: rootProject.findProperty('MAPBOX_DOWNLOADS_TOKEN'))) {
        implementation "com.mapbox.navigationcore:android-ndk27:3.34.2"
    }
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
